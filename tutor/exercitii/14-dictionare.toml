#                   if optiune == "0":
#                       break


# 3. Numele se citesc cu .title(); un nume inexistent afișează un mesaj, fără KeyError
#    scrii așa: nume = input("Numele: ").strip().title()
#               if nume in agenda:


# 4. Statistica: dicționarul oras -> număr de contacte
#    scrii așa: pe_orase[oras] = pe_orase.get(oras, 0) + 1
'''
solutie = '''
agenda = {
    "Ana Popescu": {"telefon": "0722111222", "oras": "Cluj"},
    "Mihai Ionescu": {"telefon": "0733444555", "oras": "Iași"},
    "Elena Radu": {"telefon": "0744666777", "oras": "Cluj"},
}

while True:
    print("1 = adaugă, 2 = caută, 3 = șterge, 4 = toate, 5 = statistică, 0 = ieșire")
    optiune = input("Opțiunea: ").strip()
    if optiune == "0":
        break
    if optiune == "1":
        nume = input("Numele: ").strip().title()
        telefon = input("Telefonul: ").strip()
        oras = input("Orașul: ").strip().title()
        agenda[nume] = {"telefon": telefon, "oras": oras}
        print(f"Salvat: {nume}")
    elif optiune == "2":
        cautat = input("Numele căutat: ").strip().title()
        if cautat in agenda:
            print(f"{cautat}: {agenda[cautat]['telefon']}, {agenda[cautat]['oras']}")
        else:
            print(f"{cautat} nu există în agendă.")
            for nume in sorted(agenda):
                if cautat.lower() in nume.lower():
                    print(f"  Poate: {nume}")
    elif optiune == "3":
        nume = input("Numele de șters: ").strip().title()
        if nume in agenda:
            del agenda[nume]
            print(f"Șters: {nume}")
        else:
            print(f"{nume} nu există în agendă.")
    elif optiune == "4":
        for nume in sorted(agenda):
            print(f"{nume:<15} {agenda[nume]['telefon']:<12} {agenda[nume]['oras']}")
    elif optiune == "5":
        pe_orase = {}
        for date in agenda.values():
            pe_orase[date["oras"]] = pe_orase.get(date["oras"], 0) + 1
        for oras, numar in pe_orase.items():
            print(f"{oras}: {numar}")
    else:
        print("Opțiune necunoscută.")
'''

