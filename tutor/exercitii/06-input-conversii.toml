titlu = "Convertorul de temperatură și timp"
enunt = "Convertor: nume, grade Celsius în Fahrenheit, secunde în ore, minute și secunde."
structura = ["impartire_intreaga", "modulo", "apel:float", "apel:len", "apel:str"]
indicii = [
    "Ordinea întrebărilor: numele, temperatura în Celsius, apoi numărul de secunde. Tot ce vine din `input()` e text și trebuie convertit.",
    "Pentru virgulă: `float(text.replace(\",\", \".\"))`. Pentru o zecimală: `f\"{fahrenheit:.1f}\"`. Orele sunt `secunde // 3600`, iar `secunde % 3600` e ce rămâne pentru minute și secunde.",
    "Cu 3725 de secunde: `3725 // 3600` dă 1 oră, rămân `3725 % 3600` = 125 secunde, adică `125 // 60` = 2 minute și `125 % 60` = 5 secunde. Cifrele: `len(str(secunde))`.",
]
inceput = '''
# 1. Numele, curățat (exemplu: așa se scrie)
nume = input("Cum te numești? ").strip().title()
print(f"Salut, {nume}!")

# 2. Temperatura în Celsius (poate avea virgulă) → Fahrenheit, cu o zecimală
#    scrii așa: celsius = float(input("Temperatura în °C: ").replace(",", "."))


# 3. Un număr de secunde → „X ore, Y minute și Z secunde”
#    scrii așa: ore = secunde // 3600


# 4. Câte cifre are numărul de secunde
#    scrii așa: print(len(str(secunde)))
'''
solutie = '''
nume = input("Cum te numești? ").strip().title()
celsius = float(input("Temperatura în °C: ").replace(",", "."))
fahrenheit = celsius * 9 / 5 + 32
print(f"Salut, {nume}! {celsius} °C înseamnă {fahrenheit:.1f} °F.")

secunde = int(input("Câte secunde? "))
ore = secunde // 3600
rest = secunde % 3600
minute = rest // 60
sec = rest % 60
print(f"{secunde} secunde = {ore} ore, {minute} minute și {sec} secunde")
print(f"Numărul {secunde} are {len(str(secunde))} cifre.")
'''

