titlu = "Calculatorul de reducere, cu funcții"
enunt = "Calculatorul de reducere din lecția 8, rescris cu funcțiile citeste_suma, cost_transport, reducere și afiseaza_bon."
structura = ["def", "return", "while", "apel:citeste_suma", "apel:cost_transport", "apel:reducere", "apel:afiseaza_bon"]
indicii = [
    "`citeste_suma(mesaj)`: citește textul, înlocuiește virgula cu punct și cere din nou cât timp `not text.replace(\".\", \"\", 1).isdigit()`; la final `return float(text)`.",
    "`reducere(valoare_cos, cod)` întoarce un tuplu, de exemplu `return valoare_cos * 0.10, \"\"` pentru STUDENT sau `return 0, \"Cod necunoscut\"`. Codul principal îl despachetează: `reducere_lei, mesaj = reducere(cos, cod)` și afișează mesajul dacă nu e gol.",
    "Codul principal are doar câteva rânduri: `cos = citeste_suma(\"Valoarea coșului: \")`, `cod = input(...)`, `reducere_lei, mesaj = reducere(cos, cod)`, `afiseaza_bon(cos, reducere_lei, cost_transport(cos))`.",
]
inceput = '''
# 1. citeste_suma(mesaj): cere până primește o sumă validă (cu zecimale sau virgulă) și întoarce un float
#    (exemplu: așa se scrie o funcție care întoarce un rezultat)
def citeste_suma(mesaj):
    text = input(mesaj).strip().replace(",", ".")
    while not text.replace(".", "", 1).isdigit():
        text = input("Scrie o sumă validă: ").strip().replace(",", ".")
    return float(text)


# 2. cost_transport(valoare_cos): 15 sub 100 de lei, 0 de la 100 în sus
#    scrii așa: def cost_transport(valoare_cos):
#                   if valoare_cos < 100:
#                       return 15


# 3. reducere(valoare_cos, cod) -> (reducere_lei, mesaj); nu afișează nimic
#    scrii așa: return valoare_cos * 0.10, ""


# 4. afiseaza_bon(valoare_cos, reducere_lei, transport): bonul cu 2 zecimale


# 5. Codul principal: doar câteva rânduri care apelează funcțiile
#    scrii așa: cos = citeste_suma("Valoarea coșului: ")
'''
solutie = '''
def citeste_suma(mesaj):
    text = input(mesaj).strip().replace(",", ".")
    while not text.replace(".", "", 1).isdigit():
        text = input("Scrie o sumă validă: ").strip().replace(",", ".")
    return float(text)


def cost_transport(valoare_cos):
    if valoare_cos < 100:
        return 15
    return 0


def reducere(valoare_cos, cod):
    cod = cod.strip().upper()
    if cod == "STUDENT":
        return valoare_cos * 0.10, ""
    if cod == "VARA2026":
        if valoare_cos >= 150:
            return 20, ""
        return 0, "VARA2026 se aplică doar coșurilor de cel puțin 150 lei."
    if cod != "":
        return 0, "Cod necunoscut"
    return 0, ""


def afiseaza_bon(valoare_cos, reducere_lei, transport):
    print(f"Coș: {valoare_cos:.2f} lei")
    print(f"Reducere: {reducere_lei:.2f} lei")
    print(f"Transport: {transport:.2f} lei")
    print(f"Total: {valoare_cos - reducere_lei + transport:.2f} lei")


cos = citeste_suma("Valoarea coșului: ")
cod = input("Cod de reducere: ")
reducere_lei, mesaj = reducere(cos, cod)
if mesaj:
    print(mesaj)
afiseaza_bon(cos, reducere_lei, cost_transport(cos))
'''

