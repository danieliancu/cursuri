    "La text: `for c in propozitie:` și câte un contor pentru litere, cifre, spații (`c == \" \"`) și restul. La tablă: un `for` în alt `for`, cu `print(f\"{i * j:4}\", end=\"\")` și un `print()` la finalul rândului.",
    "Bradul: `for i in range(h): print(\" \" * (h - 1 - i) + \"*\" * (2 * i + 1))`. Pentru „Am 2 mere!” trebuie 6 litere, 1 cifră, 2 spații și 1 alt caracter.",
