# numeri la fel cifrele (c.isdigit()), spațiile (c == " ") și restul caracterelor

print("=" * 30)

# 2. Tabla înmulțirii de la 1 × 1 la n × n, cu un rând de antet
#    scrii așa: for i in range(1, n + 1):
#                   for j in range(1, n + 1):


# 3. Bradul cu h rânduri, centrat
#    scrii așa: print(" " * (h - 1 - i) + "*" * (2 * i + 1))
'''
solutie = '''
propozitie = input("Propoziția: ")
litere = cifre = spatii = altele = 0
for c in propozitie:
    if c.isalpha():
        litere += 1
    elif c.isdigit():
        cifre += 1
    elif c == " ":
        spatii += 1
    else:
        altele += 1
print(f"Litere: {litere}, cifre: {cifre}, spații: {spatii}, altele: {altele}")
print("=" * 30)

n = int(input("n (1-10): "))
print("    " + "".join(f"{j:4}" for j in range(1, n + 1)))
for i in range(1, n + 1):
    rand = f"{i:4}"
    for j in range(1, n + 1):
        rand += f"{i * j:4}"
    print(rand)
print("=" * 30)

h = int(input("Înălțimea: "))
for i in range(h):
    print(" " * (h - 1 - i) + "*" * (2 * i + 1))
'''

