solutie = '''
produse = [
    {"nume": "pâine", "pret": 4.5, "stoc": 20, "categorie": "panificație"},
    {"nume": "cafea", "pret": 32.0, "stoc": 3, "categorie": "băuturi"},
    {"nume": "lapte", "pret": 8.99, "stoc": 0, "categorie": "lactate"},
    {"nume": "ceai", "pret": 14.0, "stoc": 12, "categorie": "băuturi"},
    {"nume": "iaurt", "pret": 3.49, "stoc": 30, "categorie": "lactate"},
]


def afiseaza(titlu, lista):
    print(titlu + ":", ", ".join(p["nume"] for p in lista))


def filtreaza(produse, conditie):
    return [p for p in produse if conditie(p)]


afiseaza("După preț", sorted(produse, key=lambda p: p["pret"]))
afiseaza("După stoc, descrescător", sorted(produse, key=lambda p: p["stoc"], reverse=True))
afiseaza("După categorie și nume", sorted(produse, key=lambda p: (p["categorie"], p["nume"])))

cel_mai_valoros = max(produse, key=lambda p: p["pret"] * p["stoc"])
print(f"Cea mai mare valoare a stocului: {cel_mai_valoros['nume']}")

afiseaza("În stoc", filtreaza(produse, lambda p: p["stoc"] > 0))
afiseaza("Sub 10 lei", filtreaza(produse, lambda p: p["pret"] < 10))
afiseaza("Băuturi", filtreaza(produse, lambda p: p["categorie"] == "băuturi"))

CRITERII = {"pret": lambda p: p["pret"], "nume": lambda p: p["nume"], "stoc": lambda p: p["stoc"]}
criteriu = input("Sortez după (pret / nume / stoc): ").strip()
while criteriu not in CRITERII:
    criteriu = input("Alege pret, nume sau stoc: ").strip()
for p in sorted(produse, key=CRITERII[criteriu]):
    print(f"  {p['nume']}")
