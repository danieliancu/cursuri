solutie = '''
Catalog = dict[str, list[float]]


def media(*note: float, zecimale: int = 2) -> float | None:
    """Media notelor, rotunjită la `zecimale`; None dacă nu e nicio notă."""
    if not note:
        return None
    return round(sum(note) / len(note), zecimale)


def adauga_elev(nume: str, *note: float, catalog: Catalog | None = None) -> Catalog:
    """Adaugă elevul și notele lui în catalog (unul nou, dacă nu primește) și întoarce catalogul."""
    if catalog is None:
        catalog = {}
    catalog[nume] = list(note)
    return catalog


def afiseaza_catalog(catalog: Catalog, *, prag_trecere: float = 5) -> None:
    """Afișează fiecare elev cu media lui; cei sub `prag_trecere` sunt marcați cu *."""
    for nume in sorted(catalog):
        m = media(*catalog[nume])
        print(f"{nume:<8} {m}{'*' if m is not None and m < prag_trecere else ''}")


catalog = adauga_elev("Ana", 9, 10, 8)
catalog = adauga_elev("Bogdan", 4, 5, 3, catalog=catalog)
afiseaza_catalog(catalog)
help(media)
help(adauga_elev)

# Tipul spune float, dar media("9", "10") ar da TypeError abia la rulare: Python nu verifică type hints.
'''

