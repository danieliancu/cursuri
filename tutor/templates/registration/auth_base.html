{% load static pytutor %}<!doctype html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}PyTutor{% endblock %}</title>
  <script>
    (function () {
      var pref = "dark";
      try { pref = localStorage.getItem("pt-theme") || "dark"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% asset 'tutor/app.css' %}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand auth-brand"><span class="brand-mark">py</span><span class="brand-name">PyTutor</span></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
